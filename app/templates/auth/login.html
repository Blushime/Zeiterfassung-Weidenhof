{% extends "base.html" %}
{% block title %}Anmelden — Zeiterfassung{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Anmelden</h1>
  {% if user_count == 0 %}
  <p class="muted">Es existiert noch kein Konto. Lege zuerst eines an mit:<br>
    <code>flask create-admin</code></p>
  {% endif %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>E-Mail <input type="email" name="email" required autofocus></label>
    <label>Passwort <input type="password" name="password" required></label>
    <button type="submit" class="btn primary">Anmelden</button>
  </form>
</div>
{% endblock %}
